# TableQueue CI (t27): lint + test + build smoke on every push.
#
# The backend pytest job runs under TWO pinned clocks (B-14: a green that depends
# on the host TZ is not a gate). The suite needs only a throwaway DATABASE_URL;
# JWT/STAFF credentials come from backend/tests/conftest.py defaults, so no
# credential of any kind is hardcoded here.
name: CI

on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: backend ruff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install backend dev environment (pyproject dev group)
        working-directory: backend
        run: uv sync
      - name: ruff check
        working-directory: backend
        run: uv run ruff check .

  backend-tests:
    name: backend pytest (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz:
          - UTC
          - Asia/Taipei
    env:
      TZ: ${{ matrix.tz }}
      DATABASE_URL: sqlite:///./test.db
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install backend dev environment (pyproject dev group)
        working-directory: backend
        run: uv sync
      - name: pytest full suite
        working-directory: backend
        run: uv run pytest -q

  frontend:
    name: frontend tsc + eslint + vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies from lockfile
        working-directory: frontend
        run: npm ci
      - name: tsc --noEmit
        working-directory: frontend
        run: npx tsc --noEmit
      - name: eslint
        working-directory: frontend
        run: npx eslint .
      - name: vitest --run
        working-directory: frontend
        run: npx vitest --run

  frontend-build:
    name: frontend build smoke (vite build + T15 mock-leak grep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies from lockfile
        working-directory: frontend
        run: npm ci
      - name: npm run build
        working-directory: frontend
        run: npm run build
