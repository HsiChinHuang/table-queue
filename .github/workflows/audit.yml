# TableQueue audit (t27): dependency audits + secret scan on every pull request.
#
# npm audit (frontend), pip-audit (backend, from the pyproject dev group) and a
# gitleaks scan of the PR diff. No credential of any kind is hardcoded here.
name: Audit

on:
  pull_request:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies from lockfile
        working-directory: frontend
        run: npm ci
      - name: npm audit
        working-directory: frontend
        run: npm audit

  backend-audit:
    name: pip-audit (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install backend dev environment (pyproject dev group, includes pip-audit)
        working-directory: backend
        run: uv sync
      - name: pip-audit
        working-directory: backend
        run: uv run pip-audit

  secret-scan:
    name: gitleaks secret scan (PR diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
